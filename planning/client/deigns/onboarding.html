
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0D0D0F;--ink2:#3A3A40;--ink3:#7A7A85;--ink4:#ADADB8;
  --paper:#FAFAF8;--surface:#F2F2EF;--surface2:#E8E8E4;
  --red:#E8334A;--red-l:#FFF0F2;--red-m:#F5A0AB;
  --teal:#0F8A72;--teal-l:#E8F7F4;
  --amber:#C47D0E;--amber-l:#FEF6E4;
  --b:rgba(13,13,15,.08);--b2:rgba(13,13,15,.14);
  --r:8px;--r2:14px;--r3:20px;--r4:28px;
}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--b);background:rgba(250,250,248,.9);backdrop-filter:blur(8px)}
.t-logo{display:flex;align-items:center;gap:8px}
.t-mark{width:28px;height:28px;border-radius:7px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.t-mark span{color:#fff;font-family:'DM Mono',monospace;font-size:12px}
.t-name{font-size:15px;font-weight:600;letter-spacing:-.3px}
.t-step{font-size:12px;color:var(--ink4);font-family:'DM Mono',monospace}

/* PROGRESS BAR */
.prog-wrap{height:3px;background:var(--surface2)}
.prog-bar{height:100%;background:var(--ink);transition:width .5s cubic-bezier(.4,0,.2,1)}

/* MAIN */
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:2.5rem 1.5rem}
.screen{width:100%;max-width:620px;animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-12px)}}
.screen.out{animation:fadeOut .2s ease both}

/* STEP LABEL */
.step-label{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4);margin-bottom:.75rem;display:flex;align-items:center;gap:6px}
.step-dot{width:4px;height:4px;border-radius:50%;background:var(--ink4)}

/* HEADINGS */
.screen-h1{font-size:32px;font-weight:300;letter-spacing:-.8px;color:var(--ink);line-height:1.15;margin-bottom:.6rem}
.screen-h1 strong{font-weight:600}
.screen-sub{font-size:15px;color:var(--ink3);line-height:1.65;margin-bottom:2rem}

/* GOAL CARDS */
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:2rem}
.goal-card{border:1.5px solid var(--b2);border-radius:var(--r3);padding:1.25rem 1.4rem;cursor:pointer;transition:all .18s;background:#fff;display:flex;gap:14px;align-items:flex-start}
.goal-card:hover{border-color:var(--ink4);background:var(--surface)}
.goal-card.selected{border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(13,13,15,.06)}
.gc-icon{font-size:22px;flex-shrink:0;margin-top:2px}
.gc-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px;letter-spacing:-.1px}
.gc-desc{font-size:12px;color:var(--ink3);line-height:1.5}
.gc-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--b2);margin-left:auto;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .18s;margin-top:2px}
.goal-card.selected .gc-check{background:var(--ink);border-color:var(--ink)}
.gc-check svg{display:none}
.goal-card.selected .gc-check svg{display:block}

/* LEVEL CARDS */
.level-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:2rem}
.level-row{border:1.5px solid var(--b2);border-radius:var(--r2);padding:1rem 1.25rem;cursor:pointer;transition:all .18s;background:#fff;display:flex;align-items:center;gap:14px}
.level-row:hover{border-color:var(--ink4);background:var(--surface)}
.level-row.selected{border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(13,13,15,.06)}
.lr-badge{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lr-info{flex:1}
.lr-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:1px}
.lr-desc{font-size:12px;color:var(--ink3)}
.lr-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--b2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .18s}
.level-row.selected .lr-check{background:var(--ink);border-color:var(--ink)}
.lr-check svg{display:none}
.level-row.selected .lr-check svg{display:block}

/* QUIZ */
.quiz-card{background:#fff;border:1px solid var(--b);border-radius:var(--r3);padding:2rem;margin-bottom:1.25rem}
.quiz-tag{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4);margin-bottom:1.25rem}
.quiz-q{font-size:20px;font-weight:400;color:var(--ink);margin-bottom:.4rem;line-height:1.4}
.quiz-q.jp{font-size:36px;font-weight:300;letter-spacing:2px;text-align:center;padding:.5rem 0 1rem;color:var(--ink)}
.quiz-reading{font-family:'DM Mono',monospace;font-size:13px;color:var(--ink4);text-align:center;margin-bottom:1.25rem}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quiz-opt{border:1.5px solid var(--b2);border-radius:var(--r2);padding:.85rem 1rem;cursor:pointer;transition:all .15s;background:#fff;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink2);text-align:left;font-weight:400}
.quiz-opt:hover:not(.correct):not(.wrong):not(.answered){border-color:var(--ink4);background:var(--surface)}
.quiz-opt.selected{border-color:var(--ink);background:var(--surface)}
.quiz-opt.correct{border-color:var(--teal);background:var(--teal-l);color:var(--teal)}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red)}
.quiz-opt.answered{cursor:default}
.quiz-feedback{font-size:13px;padding:.75rem 1rem;border-radius:var(--r2);margin-top:1rem;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.ok{background:var(--teal-l);color:var(--teal)}
.quiz-feedback.no{background:var(--red-l);color:var(--red)}
.quiz-counter{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink4);text-align:right;margin-bottom:.75rem}

/* RESULT */
.result-circle{width:96px;height:96px;border-radius:50%;margin:0 auto 1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--ink)}
.result-score{font-size:28px;font-weight:600;letter-spacing:-.5px;line-height:1}
.result-total{font-size:12px;color:var(--ink3)}
.result-level{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:6px 16px;margin:1.25rem auto;font-size:14px;font-weight:500}
.result-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:1.5rem 0}
.rb-item{background:var(--surface);border-radius:var(--r2);padding:.9rem .75rem;text-align:center}
.rb-val{font-size:20px;font-weight:600;letter-spacing:-.3px;margin-bottom:2px}
.rb-label{font-size:11px;color:var(--ink3)}

/* TIME GRID */
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:2rem}
.time-card{border:1.5px solid var(--b2);border-radius:var(--r2);padding:1rem;cursor:pointer;transition:all .18s;background:#fff;text-align:center}
.time-card:hover{border-color:var(--ink4);background:var(--surface)}
.time-card.selected{border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(13,13,15,.06)}
.tc-time{font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.5px;margin-bottom:2px}
.tc-label{font-size:11px;color:var(--ink3)}
.tc-desc{font-size:11px;color:var(--ink4);margin-top:3px}

/* BUTTON */
.btn-next{width:100%;padding:14px;background:var(--ink);color:#fff;border:none;border-radius:var(--r2);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-next:hover{background:#1a1a20;transform:translateY(-1px)}
.btn-next:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-back{background:none;border:none;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink3);cursor:pointer;padding:4px 0;margin-bottom:1.25rem;display:flex;align-items:center;gap:4px;transition:color .15s}
.btn-back:hover{color:var(--ink)}
</style>

<!-- TOP BAR -->
<div class="topbar">
  <a class="t-logo" href="landing_page.html" style="text-decoration:none;color:inherit">
    <div class="t-mark"><span>日</span></div>
    <span class="t-name">Nihongo</span>
  </a>
  <span class="t-step" id="step-counter">Bước 1 / 5</span>
</div>
<div class="prog-wrap"><div class="prog-bar" id="prog" style="width:20%"></div></div>

<!-- MAIN -->
<div class="main">
  <div class="screen" id="screen"></div>
</div>

<script>
const CHECK_SVG = `<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ── DATA ── */
const goals = [
  {id:'jlpt',icon:'🏆',title:'Thi JLPT',desc:'Chuẩn bị cho kỳ thi năng lực tiếng Nhật N5 → N1'},
  {id:'work',icon:'💼',title:'Làm việc',desc:'Giao tiếp công việc, email, hội họp bằng tiếng Nhật'},
  {id:'travel',icon:'✈️',title:'Du lịch',desc:'Giao tiếp khi đi du lịch, đọc biển hiệu, hỏi đường'},
  {id:'anime',icon:'🎌',title:'Anime & Manga',desc:'Hiểu không cần phụ đề, đọc manga bản gốc'},
  {id:'culture',icon:'🍣',title:'Văn hóa & Ẩm thực',desc:'Hiểu sâu hơn về văn hóa, ẩm thực, cuộc sống Nhật'},
  {id:'other',icon:'✨',title:'Mục tiêu khác',desc:'Tôi có lý do riêng để học tiếng Nhật'},
];

const levels = [
  {id:'zero',badge:'0',bg:'#F2F2EF',fg:'#7A7A85',title:'Chưa biết gì',desc:'Chưa biết bảng chữ cái Hiragana, bắt đầu từ đầu'},
  {id:'n5',badge:'N5',bg:'#E8F7F4',fg:'#0F8A72',title:'Sơ cấp',desc:'Biết Hiragana/Katakana, vốn từ vựng và ngữ pháp cơ bản'},
  {id:'n4',badge:'N4',bg:'#E8F4FF',fg:'#1565C0',title:'Cơ bản',desc:'Giao tiếp hàng ngày đơn giản, biết khoảng 300-500 Kanji'},
  {id:'n3',badge:'N3',bg:'#FEF6E4',fg:'#C47D0E',title:'Trung cấp',desc:'Đọc hiểu tương đối, làm việc môi trường Nhật được'},
  {id:'n2n1',badge:'N2+',bg:'#FFF0F2',fg:'#E8334A',title:'Cao cấp',desc:'Thành thạo, chỉ cần luyện thêm các kỹ năng chuyên sâu'},
];

const quizData = [
  {q:'「ありがとう」có nghĩa là gì?',jp:'ありがとう',reading:'arigatou',opts:['Xin chào','Cảm ơn','Tạm biệt','Xin lỗi'],ans:1,level:'N5'},
  {q:'Chọn cách đọc đúng của chữ Kanji này:',jp:'山',reading:'',opts:['かわ / kawa','やま / yama','もり / mori','うみ / umi'],ans:1,level:'N5'},
  {q:'「電車で学校に＿＿＿＿」— Điền mẫu câu đúng:',jp:'',reading:'',opts:['行きます','行くです','行いです','行きです'],ans:0,level:'N4'},
  {q:'「彼女は歌が上手だ」có nghĩa là gì?',jp:'',reading:'',opts:['Cô ấy thích hát','Cô ấy hát hay','Cô ấy đang hát','Cô ấy học hát'],ans:1,level:'N3'},
  {q:'「〜にもかかわらず」diễn đạt ý nghĩa nào?',jp:'',reading:'',opts:['Vì vậy / do đó','Mặc dù / bất chấp','Nếu / trong trường hợp','Trong khi / đồng thời'],ans:1,level:'N2'},
];

const times = [
  {id:'5',time:'5',unit:'phút/ngày',desc:'Học nhẹ nhàng, ổn định'},
  {id:'15',time:'15',unit:'phút/ngày',desc:'Tiến độ đều đặn'},
  {id:'30',time:'30',unit:'phút/ngày',desc:'Học nghiêm túc'},
  {id:'60',time:'60',unit:'phút/ngày',desc:'Tăng tốc nhanh'},
  {id:'custom',time:'—',unit:'Tự chọn',desc:'Linh hoạt mỗi ngày'},
];

/* ── STATE ── */
let step = 1; // 1=goal, 2=level, 3=quiz, 4=time, 5=result
let sel = {goal:null, level:null, time:null};
let quiz = {idx:0, answers:[], current:null};
const TOTAL_STEPS = 5;

/* ── RENDER ── */
function setProgress(s){
  document.getElementById('prog').style.width = (s/TOTAL_STEPS*100)+'%';
  document.getElementById('step-counter').textContent = `Bước ${s} / ${TOTAL_STEPS}`;
}

function transition(fn){
  const sc = document.getElementById('screen');
  sc.classList.add('out');
  setTimeout(()=>{sc.classList.remove('out');fn();},200);
}

function render(){
  setProgress(step);
  const sc = document.getElementById('screen');
  if(step===1) sc.innerHTML = renderGoal();
  else if(step===2) sc.innerHTML = renderLevel();
  else if(step===3) sc.innerHTML = renderQuiz();
  else if(step===4) sc.innerHTML = renderTime();
  else if(step===5) sc.innerHTML = renderResult();
  attachEvents();
}

/* ── STEP 1: GOAL ── */
function renderGoal(){
  return `
    <div class="step-label"><span class="step-dot"></span>Mục tiêu học</div>
    <h1 class="screen-h1">Bạn học tiếng Nhật<br><strong>để làm gì?</strong></h1>
    <p class="screen-sub">Chọn mục tiêu chính — hệ thống sẽ cá nhân hóa nội dung phù hợp nhất.</p>
    <div class="goal-grid">
      ${goals.map(g=>`
        <div class="goal-card${sel.goal===g.id?' selected':''}" data-goal="${g.id}">
          <span class="gc-icon">${g.icon}</span>
          <div style="flex:1"><div class="gc-title">${g.title}</div><div class="gc-desc">${g.desc}</div></div>
          <div class="gc-check">${sel.goal===g.id?CHECK_SVG:''}</div>
        </div>`).join('')}
    </div>
    <button class="btn-next" id="btn-next" ${sel.goal?'':'disabled'}>Tiếp theo →</button>`;
}

/* ── STEP 2: LEVEL ── */
function renderLevel(){
  return `
    <button class="btn-back" id="btn-back">← Quay lại</button>
    <div class="step-label"><span class="step-dot"></span>Trình độ hiện tại</div>
    <h1 class="screen-h1">Bạn đang ở<br><strong>cấp độ nào?</strong></h1>
    <p class="screen-sub">Đừng lo nếu chưa chắc — bước tiếp theo sẽ có quiz kiểm tra để xác nhận chính xác hơn.</p>
    <div class="level-grid">
      ${levels.map(l=>`
        <div class="level-row${sel.level===l.id?' selected':''}" data-level="${l.id}">
          <div class="lr-badge" style="background:${l.bg};color:${l.fg}">${l.badge}</div>
          <div class="lr-info"><div class="lr-title">${l.title}</div><div class="lr-desc">${l.desc}</div></div>
          <div class="lr-check">${sel.level===l.id?CHECK_SVG:''}</div>
        </div>`).join('')}
    </div>
    <button class="btn-next" id="btn-next" ${sel.level?'':'disabled'}>Tiếp theo →</button>`;
}

/* ── STEP 3: QUIZ ── */
function renderQuiz(){
  const q = quizData[quiz.idx];
  const answered = quiz.answers[quiz.idx] !== undefined;
  const userAns = quiz.answers[quiz.idx];
  const isCorrect = userAns === q.ans;
  return `
    <button class="btn-back" id="btn-back">← Quay lại</button>
    <div class="step-label"><span class="step-dot"></span>Kiểm tra nhanh</div>
    <h1 class="screen-h1">Làm vài câu để<br><strong>xác nhận trình độ</strong></h1>
    <div class="quiz-counter">${quiz.idx+1} / ${quizData.length} câu</div>
    <div class="quiz-card">
      <div class="quiz-tag">Cấp độ ${q.level}</div>
      ${q.jp ? `<div class="quiz-q jp">${q.jp}</div>${q.reading?`<div class="quiz-reading">${q.reading}</div>`:''}` : ''}
      <div class="quiz-q" style="${q.jp?'font-size:14px;color:var(--ink3)':''}">${q.q}</div>
      <div class="quiz-opts" style="margin-top:1rem">
        ${q.opts.map((o,i)=>{
          let cls='quiz-opt';
          if(answered){
            cls+=' answered';
            if(i===q.ans) cls+=' correct';
            else if(i===userAns && userAns!==q.ans) cls+=' wrong';
          }
          return `<button class="quiz-opt${answered?' answered':''}${answered&&i===q.ans?' correct':''}${answered&&i===userAns&&userAns!==q.ans?' wrong':''}" data-opt="${i}">${o}</button>`;
        }).join('')}
      </div>
      ${answered ? `<div class="quiz-feedback show ${isCorrect?'ok':'no'}">${isCorrect?'✓ Chính xác! '+q.opts[q.ans]:'✗ Đáp án đúng: '+q.opts[q.ans]}</div>` : ''}
    </div>
    <button class="btn-next" id="btn-next" ${answered?'':'disabled'}>
      ${quiz.idx < quizData.length-1 ? 'Câu tiếp theo →' : 'Xem kết quả →'}
    </button>`;
}

/* ── STEP 4: TIME ── */
function renderTime(){
  return `
    <button class="btn-back" id="btn-back">← Quay lại</button>
    <div class="step-label"><span class="step-dot"></span>Thời gian học</div>
    <h1 class="screen-h1">Mỗi ngày bạn có<br><strong>bao nhiêu thời gian?</strong></h1>
    <p class="screen-sub">Hệ thống sẽ giao đúng lượng bài tập phù hợp — không quá nhiều, không quá ít.</p>
    <div class="time-grid">
      ${times.map(t=>`
        <div class="time-card${sel.time===t.id?' selected':''}" data-time="${t.id}">
          <div class="tc-time">${t.time}</div>
          <div class="tc-label">${t.unit}</div>
          <div class="tc-desc">${t.desc}</div>
        </div>`).join('')}
    </div>
    <button class="btn-next" id="btn-next" ${sel.time?'':'disabled'}>Xây dựng lộ trình →</button>`;
}

/* ── STEP 5: RESULT ── */
function renderResult(){
  const correct = quiz.answers.filter((a,i)=>a===quizData[i].ans).length;
  const pct = Math.round(correct/quizData.length*100);
  let detectedLevel, levelBg, levelFg, levelDesc;
  if(pct>=80){detectedLevel='N3';levelBg='#FEF6E4';levelFg='#C47D0E';levelDesc='Trung cấp'}
  else if(pct>=60){detectedLevel='N4';levelBg='#E8F4FF';levelFg='#1565C0';levelDesc='Cơ bản'}
  else{detectedLevel='N5';levelBg='#E8F7F4';levelFg='#0F8A72';levelDesc='Sơ cấp'}

  const goalObj = goals.find(g=>g.id===sel.goal);
  const timeObj = times.find(t=>t.id===sel.time);

  return `
    <div style="text-align:center;margin-bottom:2rem">
      <div class="step-label" style="justify-content:center"><span class="step-dot"></span>Lộ trình của bạn</div>
      <div class="result-circle">
        <div class="result-score">${correct}/${quizData.length}</div>
        <div class="result-total">${pct}% đúng</div>
      </div>
      <h1 class="screen-h1" style="text-align:center">Hệ thống đã<br><strong>xây dựng lộ trình!</strong></h1>
      <div style="display:flex;justify-content:center">
        <div class="result-level">
          <span style="font-family:'DM Mono',monospace;font-size:12px;font-weight:500;background:${levelBg};color:${levelFg};padding:2px 8px;border-radius:999px">${detectedLevel}</span>
          <span style="font-size:14px;color:var(--ink2)">Cấp độ phù hợp: ${levelDesc}</span>
        </div>
      </div>
    </div>
    <div class="result-breakdown">
      <div class="rb-item">
        <div class="rb-val">${goalObj?goalObj.icon:'🎯'}</div>
        <div class="rb-label">${goalObj?goalObj.title:'Mục tiêu'}</div>
      </div>
      <div class="rb-item">
        <div class="rb-val" style="font-size:14px;font-family:'DM Mono',monospace">${detectedLevel}</div>
        <div class="rb-label">Cấp độ bắt đầu</div>
      </div>
      <div class="rb-item">
        <div class="rb-val" style="font-size:14px">${timeObj?timeObj.time+' phút':'—'}</div>
        <div class="rb-label">Mỗi ngày</div>
      </div>
    </div>

/* ── EVENTS ── */
function attachEvents(){
  // goal select
  document.querySelectorAll('[data-goal]').forEach(el=>{
    el.addEventListener('click',()=>{
      sel.goal=el.dataset.goal;
      transition(render);
    });
  });
  // level select
  document.querySelectorAll('[data-level]').forEach(el=>{
    el.addEventListener('click',()=>{
      sel.level=el.dataset.level;
      transition(render);
    });
  });
  // quiz options
  document.querySelectorAll('[data-opt]').forEach(el=>{
    el.addEventListener('click',()=>{
      if(quiz.answers[quiz.idx]!==undefined) return;
      quiz.answers[quiz.idx]=parseInt(el.dataset.opt);
      render();
    });
  });
  // time select
  document.querySelectorAll('[data-time]').forEach(el=>{
    el.addEventListener('click',()=>{
      sel.time=el.dataset.time;
      transition(render);
    });
  });
  // next
  const btnNext = document.getElementById('btn-next');
  if(btnNext && !btnNext.onclick){
    btnNext.addEventListener('click',()=>{
      if(step===3){
        if(quiz.idx < quizData.length-1){
          quiz.idx++;
          transition(render);
        } else {
          step=4;
          transition(render);
        }
      } else if(step < TOTAL_STEPS){
        step++;
        transition(render);
      }
    });
  }
  // back
  const btnBack = document.getElementById('btn-back');
  if(btnBack){
    btnBack.addEventListener('click',()=>{
      if(step===3 && quiz.idx>0){quiz.idx--;transition(render);}
      else{step--;transition(render);}
    });
  }
}

render();
</script>
